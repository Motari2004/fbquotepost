<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Studio</title>
    <style>
        :root {
            --primary: #6366f1; --primary-hover: #4f46e5; --success: #22c55e;
            --bg: #0a0a0c; --card-bg: #16161d; --text-main: #ffffff;
            --text-dim: #94a3b8; --border: #2d2d3a;
        }
        body { 
            font-family: 'Inter', sans-serif; background-color: var(--bg); 
            background-image: radial-gradient(circle at top right, #1e1b4b, transparent),
                              radial-gradient(circle at bottom left, #1e1b4b, transparent);
            color: var(--text-main); display: flex; justify-content: center; 
            align-items: center; min-height: 100vh; margin: 0; padding: 20px;
        }
        .studio-container { 
            background: var(--card-bg); padding: 40px; border-radius: 24px; 
            width: 100%; max-width: 500px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); border: 1px solid var(--border);
            backdrop-filter: blur(10px);
        }
        h2 { font-size: 28px; margin-bottom: 8px; background: linear-gradient(to right, #fff, #a5b4fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-dim); margin-bottom: 32px; font-size: 14px; }
        input { 
            width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--border); 
            background: #1f1f29; color: white; font-size: 16px; box-sizing: border-box;
            transition: all 0.2s; outline: none; margin-bottom: 24px;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .btn-generate { 
            width: 100%; padding: 14px; cursor: pointer; border-radius: 12px; border: none; 
            background: var(--primary); color: white; font-size: 16px; font-weight: 600; 
            transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .btn-generate:disabled { opacity: 0.6; cursor: not-allowed; }
        #preview { margin-top: 32px; display: none; animation: slideUp 0.4s ease-out; text-align: left; }
        .preview-label { font-size: 12px; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; display: block; letter-spacing: 1px; }
        img { width: 100%; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); border: 1px solid var(--border); }
        .caption-editor { 
            background: #1f1f29; padding: 15px; border-radius: 12px; margin-bottom: 24px; 
            color: #ddd; line-height: 1.6; border: 1px solid var(--border);
            width: 100%; box-sizing: border-box; font-family: inherit; font-size: 15px; resize: vertical; min-height: 80px;
        }
        .btn-post { background: var(--success); color: white; width: 100%; padding: 14px; border-radius: 12px; border: none; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-post:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-post:disabled { opacity: 0.6; cursor: not-allowed; }
        .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="studio-container">
        <h2>🚀 AI Content Studio</h2>
        <p class="subtitle">Ollama (Quotes) &bull; Unsplash (Visuals) &bull; Buffer</p>
        <input type="text" id="topic" placeholder="Enter topic (e.g. Discipline)">
        <button class="btn-generate" id="genBtn" onclick="generate()">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Generate Magic</span>
        </button>
        <div id="preview">
            <span class="preview-label">Visual Preview</span>
            <img id="resImg" src="">
            <span class="preview-label">Caption (Edit me!)</span>
            <textarea class="caption-editor" id="resCap"></textarea>
            <button class="btn-post" onclick="post()">Publish to Facebook</button>
        </div>
    </div>
    <script>
        let currentPost = {};

        async function generate() {
            const topic = document.getElementById('topic').value;
            const btn = document.getElementById('genBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');
            const preview = document.getElementById('preview');
            if(!topic) return alert("Please enter a topic");
            btn.disabled = true; btnText.innerText = "Creating..."; spinner.style.display = "block"; preview.style.display = 'none';
            try {
                const res = await fetch('/generate', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic})
                });
                const data = await res.json();
                currentPost = data;
                document.getElementById('resImg').src = data.image_url;
                document.getElementById('resCap').value = data.caption;
                preview.style.display = 'block';
            } catch (e) { alert("Error connecting to server"); } 
            finally { btn.disabled = false; btnText.innerText = "Generate Magic"; spinner.style.display = "none"; }
        }

        async function post() {
            currentPost.caption = document.getElementById('resCap').value;
            const btn = document.querySelector('.btn-post');
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerText = "Posting...";
            try {
                const res = await fetch('/post', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(currentPost)
                });
                const data = await res.json();
                if (res.ok && data.status === 'success') {
                    alert('✅ Posted to Facebook!\nPost ID: ' + data.post_id);
                } else {
                    alert('❌ Error: ' + (data.detail || 'Unknown error'));
                }
            } catch (e) {
                alert('Network error: ' + e.message);
            } finally {
                btn.disabled = false; btn.innerText = originalText;
            }
        }
    </script>
</body>
</html>
